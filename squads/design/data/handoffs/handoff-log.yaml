# Design Squad — Handoff Log
# Registro de handoffs entre Design Squad e outros squads/times.

schema_version: "1.0"
last_updated: "2026-03-18"

fields:
  - id: string          # HND-001
  - date: date
  - direction: enum     # outgoing | incoming
  - counterpart: string # Nome do squad ou time
  - project: string
  - package: list       # O que foi entregue
  - quality_gate_result: enum  # pass | fail | conditional
  - issues_found: list
  - resolution: string
  - sla_met: boolean
  - status: enum        # pending | delivered | accepted | returned | completed

