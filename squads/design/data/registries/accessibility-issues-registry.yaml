# Accessibility Issues Registry
# Registro de issues de acessibilidade identificadas, priorizadas e rastreadas.

schema_version: "1.0"
last_updated: "2026-03-06"

fields:
  - id: string            # A11Y-001
  - title: string         # Descricao do issue
  - wcag_criterion: string # 1.4.3, 2.1.1, etc.
  - principle: enum       # perceivable | operable | understandable | robust
  - severity: enum        # critical | high | medium | low
  - component: string     # Componente afetado
  - page: string          # Pagina onde foi encontrado
  - status: enum          # open | in-progress | resolved | wont-fix
  - found_date: date
  - resolved_date: date
  - assignee: string
  - tool: string          # Ferramenta que detectou

entries:
