# Design Debt Registry
# Registro de debito de design — inconsistencias, workarounds e melhorias adiadas.

schema_version: "1.0"
last_updated: "2026-03-06"

fields:
  - id: string          # DEBT-001
  - title: string       # Descricao da divida
  - category: enum      # consistency | a11y | performance | pattern | token
  - severity: enum      # critical | high | medium | low
  - impact: string      # Impacto no usuario ou time
  - effort: enum        # small (< 1d) | medium (1-3d) | large (3d+)
  - status: enum        # identified | planned | in-progress | resolved
  - created_date: date
  - target_date: date
  - owner: string

