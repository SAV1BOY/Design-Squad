# Design Artifact Registry
# Registro de artefatos de design produzidos (wireframes, mockups, prototipos, specs).

schema_version: "1.0"
last_updated: "2026-03-18"

fields:
  - id: string            # ART-001
  - date: date            # Data de criacao do artefato
  - type: enum            # wireframe | mockup | prototype | spec | icon_set | illustration
  - project: string       # Projeto relacionado
  - creator: string       # Designer responsavel
  - status: enum          # draft | in_review | approved | deprecated
  - version: string       # Versao do artefato (ex: v1.2)
  - figma_link: string    # Link para o arquivo no Figma
  - quality_score: float  # Score de qualidade (0.0 a 10.0)

