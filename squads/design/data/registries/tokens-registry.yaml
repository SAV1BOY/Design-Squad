# Tokens Registry
# Catalogo de design tokens com camada, categoria, valor e status.

schema_version: "1.0"
last_updated: "2026-03-06"

fields:
  - id: string          # token ID (kebab-case)
  - layer: enum         # global | alias | component
  - category: enum      # color | typography | spacing | elevation | radius | motion
  - value_light: string # Valor no tema light
  - value_dark: string  # Valor no tema dark
  - status: enum        # active | deprecated
  - deprecated_by: string # Token substituto (se deprecated)
  - usage_count: int    # Numero de usos no codebase

