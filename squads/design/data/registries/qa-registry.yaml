# QA Registry
# Registro de QA visual reviews.

schema_version: "1.0"
last_updated: "2026-03-18"

fields:
  - id: string                # QA-001
  - date: date                # Data da review de QA
  - project: string           # Projeto relacionado
  - reviewer: string          # Responsavel pela review
  - bugs_found: integer       # Total de bugs visuais encontrados
  - severity_breakdown: map   # Distribuicao por severidade (critical, major, minor)
  - resolution_status: enum   # open | partially_resolved | fully_resolved
  - time_to_fix: string       # Tempo medio para correcao (ex: "3d", "1w")

