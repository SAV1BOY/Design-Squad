# ------------------------------------------------------------
# Quality Gates — sistema em cascata
# ------------------------------------------------------------
quality_gates:

  mandatory:
    - gate: discovery-brief-quality
      description: >
        Todo projeto deve ter um brief de discovery validado
        antes de avancar para qualquer fase de design.
      blocking: true
      owner: design-chief
      checklist: checklists/discovery-brief-quality
      pass_criteria: "100% dos itens obrigatorios marcados"

    - gate: accessibility-quality
      description: >
        Auditoria de acessibilidade WCAG 2.1 AA obrigatoria.
        Violacoes criticas bloqueiam release.
      blocking: true
      owner: ux-design-expert
      checklist: checklists/accessibility-quality
      pass_criteria: "0 violacoes criticas, 0 violacoes graves"

    - gate: handoff-quality
      description: >
        Pacote de handoff deve conter specs completas,
        tokens mapeados e assets exportados.
      blocking: true
      owner: design-chief
      checklist: checklists/handoff-quality
      pass_criteria: "100% dos itens do handoff checklist"

  per_domain:
    - gate: component-spec-quality
      applies_to: [design-system-bootstrap, create-component-spec, create-or-update-tokens]
      description: Componentes devem ter spec completa antes de publicacao.
      owner: design-system-architect
      checklist: checklists/component-spec-quality
      pass_criteria: "Spec completa com props, states, tokens, a11y e exemplos"

    - gate: usability-test-quality
      applies_to: [build-prototype, run-usability-test]
      description: Prototipos testados devem ter relatorio de findings.
      owner: ux-design-expert
      checklist: checklists/usability-test-quality
      pass_criteria: "Min 5 participantes, findings priorizados, recommendations"

    - gate: metrics-review-quality
      applies_to: [post-release-review, quarterly-design-review]
      description: Reviews devem incluir dados quantitativos validados.
      owner: design-chief
      pass_criteria: "Metricas HEART + KPIs operacionais com baseline e target"

  inter_agent:
    - gate: ux-to-ui-transition
      description: Wireframes devem estar aprovados antes de iniciar UI high-fidelity.
      from_agent: ux-design-expert
      to_agent: jessica-ux-ui
      checklist: checklists/wireframe-quality
      pass_criteria: "Wireframes revisados e aprovados por ux-design-expert"

    - gate: ui-to-ds-transition
      description: UI specs devem usar tokens existentes antes de criar novos.
      from_agent: jessica-ux-ui
      to_agent: design-system-architect
      checklist: checklists/token-quality
      pass_criteria: "100% dos valores visuais mapeados para tokens"

    - gate: ds-to-handoff-transition
      description: Componentes devem estar documentados antes de handoff.
      from_agent: design-system-architect
      to_agent: jessica-ux-ui
      checklist: checklists/component-spec-quality
      pass_criteria: "Component spec completa com todas as variantes"

  inter_squad:
    - gate: design-to-copy-handoff
      description: Contexto de tela deve estar completo antes de solicitar copy.
      from_squad: design
      to_squad: copy
      pass_criteria: "User flow + wireframe + contexto de uso documentados"

    - gate: brand-to-design-receive
      description: Brand assets devem estar no formato correto antes de uso.
      from_squad: brand
      to_squad: design
      pass_criteria: "Assets em formato vetorial, tokens de cor documentados"

    - gate: design-to-pre-programming-handoff
      description: Design specs devem estar completas com todos os estados e breakpoints.
      from_squad: design
      to_squad: pre-programming
      pass_criteria: "Specs com todos os estados, edge cases, breakpoints e tokens mapeados"

    - gate: data-to-design-receive
      description: Dados analiticos devem ter sample size e periodo adequados.
      from_squad: data
      to_squad: design
      pass_criteria: "Sample size minimo documentado, periodo de coleta >= 2 semanas"

    - gate: design-to-deepresearch-handoff
      description: Research questions devem ser especificas e acionaveis.
      from_squad: design
      to_squad: deepresearch
      pass_criteria: "Perguntas com hipotese, contexto e criterio de suficiencia definidos"

    - gate: cybersecurity-to-design-receive
      description: Security requirements devem ter nivel de risco classificado.
      from_squad: cybersecurity
      to_squad: design
      pass_criteria: "Requisitos com nivel de risco, prioridade e cenarios de ameaca"

    - gate: design-to-c-level-report
      description: Impact reports devem conter metricas quantitativas reais.
      from_squad: design
      to_squad: c-level
      pass_criteria: "Metricas com baseline, target, resultado atual e recomendacoes"

  cascade_logic: >
    Gates operam em cascata: agent_gate -> domain_gate -> mandatory_gate -> chief_approval.
    Se qualquer gate falha, a saida retorna ao agente responsavel com feedback especifico.
    O design-chief pode overridar gates per_domain com justificativa documentada.
    Gates mandatory NUNCA podem ser overridados.

# ------------------------------------------------------------
# Escalation Rules
# ------------------------------------------------------------
escalation_rules:

  within_squad:
    - trigger: "Agent nao consegue resolver task em 2x o tempo estimado"
      action: "Escalar para design-chief para reavaliacao de escopo ou agent reassignment"

    - trigger: "Dois agents discordam sobre abordagem"
      action: "Design-chief arbitra com base em evidencias. Se sem evidencias, consulta core expert relevante"

    - trigger: "Quality gate reprova 3x consecutivas"
      action: "Design-chief convoca sessao de troubleshooting com agent + reviewer"

  cross_squad:
    - trigger: "Dependencia de outro squad bloqueia task por mais de 3 dias uteis"
      action: "Design-chief escala para PM Lead com contexto e impacto documentados"

    - trigger: "Output recebido de outro squad nao atende quality gate"
      action: "Design-chief devolve com feedback especifico e sugere sessao de alinhamento"

  to_hrm_layer:
    - trigger: "Conflito de prioridade entre squads nao resolvido em 5 dias uteis"
      action: "Escalar para HRM Chief / Central Command com documentacao completa"

    - trigger: "Squad sobrecarregado sem possibilidade de renegociacao"
      action: "Design-chief reporta ao HRM Layer com proposta de realocacao ou repriorizacao"

# ------------------------------------------------------------
# Delegation Rules
# ------------------------------------------------------------
delegation_rules:

  - condition: "Task envolve UX writing / microcopy extensivo"
    delegate_to: copy_squad
    handoff_includes: [contexto-de-tela, fluxo-do-usuario, tom-de-voz-esperado]

  - condition: "Task envolve criacao de identidade visual from scratch"
    delegate_to: brand_squad
    handoff_includes: [briefing-visual, referencias, constraints-de-produto]

  - condition: "Task requer analise quantitativa de comportamento"
    delegate_to: traffic_squad
    handoff_includes: [hipoteses, metricas-de-interesse, periodo-de-analise]

  - condition: "Task requer narrativa de produto ou case study"
    delegate_to: storytelling_squad
    handoff_includes: [dados-de-pesquisa, assets-visuais, resultados-de-metricas]

  - condition: "Task requer pesquisa profunda de mercado ou academica"
    delegate_to: deepresearch_squad
    handoff_includes: [research-questions, hipoteses, contexto-do-problema, criterio-de-suficiencia]

  - condition: "Task envolve requisitos de seguranca, autenticacao ou privacidade"
    delegate_to: cybersecurity_squad
    handoff_includes: [fluxo-atual, pontos-de-risco-identificados, requisitos-de-compliance]

  - condition: "Task requer dados analiticos de comportamento ou metricas de produto"
    delegate_to: data_squad
    handoff_includes: [hipoteses, metricas-de-interesse, periodo-de-analise, segmentos-alvo]

  - condition: "Task requer alinhamento cultural ou comunitario"
    delegate_to: movement_squad
    handoff_includes: [contexto-visual, publico-alvo, valores-de-marca]

  - condition: "Task exige implementacao frontend"
    action: "NAO delegar — design squad NAO implementa codigo. Handoff para pre-programming."

# ------------------------------------------------------------
# Cadence / Loops / Kaizen
# ------------------------------------------------------------
cadence:

  daily:
    - name: design-standup
      participants: [design-chief, functional_agents]
      duration: 15min
      purpose: "Status, blockers, priorizacao do dia"

  weekly:
    - name: design-critique
      participants: all_agents
      duration: 60min
      purpose: "Critica construtiva de trabalho em progresso"
      framework: frameworks/design-review-and-critique

    - name: design-ops-sync
      participants: [design-chief, design-system-architect]
      duration: 30min
      purpose: "Saude do DS, debt, backlog de melhorias"

  biweekly:
    - name: cross-squad-sync
      participants: [design-chief]
      duration: 45min
      purpose: "Alinhamento com todos os squads integrados: Copy, Brand, Traffic, Storytelling, Data, Pre-Programming, Deep Research, Cybersecurity, Movement"

    - name: strategic-alignment
      participants: [design-chief]
      duration: 30min
      purpose: "Alinhamento estrategico com C-Level e Advisory Board (quando aplicavel)"

  quarterly:
    - name: quarterly-design-review
      participants: all_agents
      duration: 120min
      purpose: "Review completo de metricas, maturidade e roadmap"
      framework: frameworks/governance-layer

  continuous:
    - name: kaizen-loop
      description: >
        Ciclo continuo de melhoria: Create -> Test -> Analyze -> Learn -> Adjust.
        Cada ciclo gera entrada em data/learnings/learning-log.yaml.
        Lessons learned alimentam proximas decisoes via data/registries/lessons-learned-registry.yaml.
      trigger: "Apos cada post-release-review ou quarterly-review"
      output: data/learnings/learning-log

# ------------------------------------------------------------
# Score Thresholds
# ------------------------------------------------------------
score_thresholds:

  gate_pass: 100%          # Gates mandatory exigem 100% dos itens
  gate_pass_domain: 90%    # Gates per_domain aceitam 90% com justificativa
  quality_bar_minimum: 80% # Abaixo de 80% em qualquer checklist = rework obrigatorio
  gold_standard: 95%       # Acima de 95% = nivel GOLD
  sota_threshold: 98%      # Acima de 98% = nivel SOTA

  agent_performance:
    rework_rate_max: 15%   # Se agent tem > 15% rework rate, review de performance
    throughput_min: 3       # Min 3 tasks/sprint por agent funcional

# ------------------------------------------------------------
# KPIs
# ------------------------------------------------------------
kpis:

  user_experience:
    - task_success_rate
    - time_on_task
    - error_rate
    - satisfaction_score_sus
    - net_promoter_score

  heart_metrics:
    - happiness
    - engagement
    - adoption
    - retention
    - task_success

  design_system:
    - component_coverage
    - token_adoption_rate
    - library_version_drift
    - component_reuse_ratio
    - documentation_completeness

  accessibility:
    - wcag_compliance_score
    - critical_violations_count
    - remediation_time_avg
    - screen_reader_pass_rate
    - color_contrast_pass_rate

  operational:
    - cycle_time_discovery_to_handoff
    - design_debt_ratio
    - review_turnaround_time
    - rework_rate
    - squad_throughput

# ------------------------------------------------------------
# Defaults
# ------------------------------------------------------------
defaults:
  review_agent: design-chief
  min_checklists: 1
  registry_on_completion: true
  output_format: markdown
  a11y_standard: "WCAG 2.1 AA"
  token_format: style-dictionary
  prototype_tool: figma
  handoff_model: token-based
