# ============================================================
# Design Squad — config.yaml
# O cerebro de roteamento do squad de design.
# Linguagem mista: chaves em English, descricoes em PT-BR.
# Versao: 2.0.0 — Audit GOLD/SOTA alignment
# ============================================================

squad:
  name: design-squad
  version: "2.0.0"
  description: >
    Squad responsavel por todas as disciplinas de design:
    discovery, UX, UI, design system, prototyping, handoff,
    QA visual e governanca de design.
  chief_agent: design-chief
  lang: pt-BR
  created: "2026-03-06"
  updated: "2026-03-18"

# ------------------------------------------------------------
# Principles
# ------------------------------------------------------------
principles:
  - evidence_over_opinion
  - system_first
  - accessibility_by_default
  - ship_learn_iterate
  - docs_as_truth

# ------------------------------------------------------------
# Taxonomy — classificacao funcional do squad
# ------------------------------------------------------------
taxonomy:
  domains:
    - discovery
    - research
    - strategy
    - ux-design
    - ui-design
    - design-system
    - prototyping
    - handoff
    - accessibility
    - qa
    - governance
    - operations

  agent_tiers:
    core_experts: [brad-frost, dan-mall, dave-malouf]
    functional_agents: [design-chief, ux-design-expert, jessica-ux-ui, design-system-architect, nano-banana-generator]

  teams:
    research_team:
      lead: ux-design-expert
      members: [dave-malouf, jessica-ux-ui]
      scope: discovery, research, synthesis, personas, JTBD
    ux_team:
      lead: ux-design-expert
      members: [jessica-ux-ui, dave-malouf]
      scope: IA, user flows, wireframes, journey maps
    ui_team:
      lead: jessica-ux-ui
      members: [design-system-architect, nano-banana-generator]
      scope: visual design, high-fidelity, motion, explorations
    ds_team:
      lead: design-system-architect
      members: [brad-frost, dan-mall]
      scope: tokens, components, library, governance
    governance_team:
      lead: design-chief
      members: [dan-mall, dave-malouf, brad-frost]
      scope: reviews, critiques, debt, metrics, decisions

# ------------------------------------------------------------
# Routing — cada task mapeia agents (em ordem de execucao),
# frameworks, checklists, templates e registries.
# Paths sao relativos a squads/design/
# ------------------------------------------------------------
routing:

  # === DISCOVERY ===

  problem-definition:
    agents: [design-chief, ux-design-expert, dave-malouf]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "facilitar workshop de framing" }
      2: { agent: dave-malouf, role: advisor, action: "validar enquadramento estrategico" }
      3: { agent: design-chief, role: approver, action: "aprovar problem statement final" }
    frameworks:
      mandatory: [frameworks/discovery-layer]
      optional: [frameworks/jobs-to-be-done, frameworks/design-thinking]
    checklists: [checklists/discovery-brief-quality]
    templates: [templates/briefs/discovery-brief]
    registry: data/registries/discovery-registry
    metrics: [cycle_time_discovery_to_handoff]
    quality_gate: discovery-brief-quality
    handoff_rule: "Se problema envolve narrativa de produto, handoff para storytelling_squad"
    escalation: "Se stakeholders discordam sobre escopo, design-chief escala para PM Lead"
    rework_loop: "Se gate reprova, retorna a step 1 com feedback especifico"

  competitive-ui-audit:
    agents: [jessica-ux-ui, ux-design-expert]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "executar audit visual e funcional" }
      2: { agent: ux-design-expert, role: reviewer, action: "validar findings e insights" }
    frameworks:
      mandatory: [frameworks/competitive-audit-framework]
      optional: [frameworks/nielsen-heuristics]
    checklists: [checklists/ux-audit-quality]
    templates: [templates/research/competitive-analysis-template]
    registry: data/registries/research-insights-registry
    quality_gate: research-plan-quality
    rework_loop: "Se audit incompleto (< 5 competidores), retorna a jessica-ux-ui"

  design-audit-existing-product:
    agents: [design-chief, jessica-ux-ui, brad-frost]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "executar audit heuristico e visual" }
      2: { agent: brad-frost, role: advisor, action: "avaliar consistencia de sistema" }
      3: { agent: design-chief, role: approver, action: "aprovar report final" }
    frameworks:
      mandatory: [frameworks/design-audit-framework]
      optional: [frameworks/nielsen-heuristics, frameworks/frost-interface-inventory]
    checklists: [checklists/ux-audit-quality]
    templates: [templates/reports/ux-audit-report-template]
    registry: data/registries/research-insights-registry
    quality_gate: discovery-brief-quality
    rework_loop: "Se findings insuficientes, brad-frost solicita deep-dive em areas especificas"

  # === RESEARCH ===

  plan-and-run-interviews:
    agents: [ux-design-expert, dave-malouf]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "planejar e executar entrevistas" }
      2: { agent: dave-malouf, role: advisor, action: "revisar guia e validar insights" }
    frameworks:
      mandatory: [frameworks/interview-framework]
      optional: [frameworks/malouf-research-to-decision]
    checklists: [checklists/interview-guide-quality, checklists/research/research-consent-and-privacy]
    templates: [templates/research/interview-script-template, templates/research/interview-notes-template]
    registry: data/registries/research-insights-registry
    quality_gate: interview-guide-quality
    rework_loop: "Se insights vagos, dave-malouf solicita nova rodada com perguntas refinadas"

  run-usability-test:
    agents: [ux-design-expert, jessica-ux-ui]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "planejar e conduzir testes" }
      2: { agent: jessica-ux-ui, role: support, action: "preparar prototipos para teste" }
    frameworks:
      mandatory: [frameworks/usability-testing-framework]
      optional: [frameworks/sus-system-usability-scale]
    checklists: [checklists/usability-test-quality, checklists/prototyping/proto-usability-setup]
    templates: [templates/research/usability-test-plan, templates/reports/usability-test-report-template]
    registry: data/registries/research-insights-registry
    quality_gate: usability-test-quality
    rework_loop: "Se sample < 5 participantes, re-recrutar antes de sintetizar"

  run-card-sort:
    agents: [ux-design-expert]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "planejar e executar card sort" }
    frameworks:
      mandatory: [frameworks/card-sort-framework]
      optional: [frameworks/information-architecture-toolkit]
    checklists: [checklists/research-plan-quality]
    templates: [templates/research/card-sort-template]
    registry: data/registries/research-insights-registry
    quality_gate: research-plan-quality

  synthesize-insights:
    agents: [ux-design-expert, design-chief]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "sintetizar dados e gerar insights" }
      2: { agent: design-chief, role: approver, action: "validar priorizacao de insights" }
    frameworks:
      mandatory: [frameworks/insight-synthesis-framework]
      optional: [frameworks/malouf-research-to-decision, frameworks/jobs-to-be-done]
    checklists: [checklists/synthesis-quality, checklists/research/research-insight-scoring]
    templates: [templates/research/insights-and-opportunities-template]
    registry: data/registries/research-insights-registry
    quality_gate: synthesis-quality
    rework_loop: "Se insights nao sao acionaveis, retorna com pedido de evidencias adicionais"

  # === INFORMATION ARCHITECTURE ===

  build-ia-and-sitemap:
    agents: [ux-design-expert, jessica-ux-ui]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "definir IA e hierarquia" }
      2: { agent: jessica-ux-ui, role: support, action: "criar sitemap visual" }
    frameworks:
      mandatory: [frameworks/information-architecture-toolkit]
      optional: [frameworks/progressive-disclosure]
    checklists: [checklists/ia-and-navigation-quality]
    templates: [templates/ux/ia-sitemap-template]
    registry: data/registries/design-artifact-registry
    quality_gate: ia-and-navigation-quality

  design-user-flows:
    agents: [ux-design-expert, jessica-ux-ui]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "mapear fluxos de usuario" }
      2: { agent: jessica-ux-ui, role: support, action: "documentar fluxos visuais" }
    frameworks:
      mandatory: [frameworks/ux-layer]
      optional: [frameworks/error-prevention-and-recovery]
    checklists: [checklists/user-flow-quality]
    templates: [templates/ux/user-flow-template]
    registry: data/registries/design-artifact-registry
    quality_gate: user-flow-quality

  create-personas-or-jtbd:
    agents: [ux-design-expert, dave-malouf]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "criar personas ou JTBD" }
      2: { agent: dave-malouf, role: advisor, action: "validar alinhamento estrategico" }
    frameworks:
      mandatory: [frameworks/strategy-layer]
      optional: [frameworks/jobs-to-be-done, frameworks/malouf-ux-strategy-framework]
    checklists: [checklists/persona-quality]
    templates: [templates/ux/persona-template, templates/ux/jtbd-template]
    registry: data/registries/research-insights-registry
    quality_gate: persona-quality

  create-journey-map:
    agents: [ux-design-expert, jessica-ux-ui]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "mapear jornada do usuario" }
      2: { agent: jessica-ux-ui, role: support, action: "visualizar journey map" }
    frameworks:
      mandatory: [frameworks/user-journey-mapping]
      optional: [frameworks/service-blueprinting]
    checklists: [checklists/journey-map-quality]
    templates: [templates/ux/journey-map-template]
    registry: data/registries/research-insights-registry
    quality_gate: journey-map-quality

  # === UX DESIGN ===

  wireframe-pack:
    agents: [jessica-ux-ui, ux-design-expert]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "criar wireframes lo-fi" }
      2: { agent: ux-design-expert, role: reviewer, action: "revisar fluxo e usabilidade" }
    frameworks:
      mandatory: [frameworks/ux-layer]
      optional: [frameworks/fitts-law, frameworks/hick-law]
    checklists: [checklists/wireframe-quality]
    templates: [templates/ui/wireframe-pack-template]
    registry: data/registries/design-artifact-registry
    quality_gate: wireframe-quality
    rework_loop: "Se wireframe falha em heuristic review, retorna a jessica-ux-ui com feedback"

  # === UI DESIGN ===

  ui-design-high-fidelity:
    agents: [jessica-ux-ui, design-system-architect]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "criar UI high-fidelity" }
      2: { agent: design-system-architect, role: reviewer, action: "validar uso de tokens e componentes" }
    frameworks:
      mandatory: [frameworks/ui-layer]
      optional: [frameworks/gestalt-principles, frameworks/responsive-design-system]
    checklists: [checklists/ui-visual-quality, checklists/ui/ui-visual-hierarchy]
    templates: [templates/ui/ui-style-sheet-template]
    registry: data/registries/design-artifact-registry
    quality_gate: ui-visual-quality
    rework_loop: "Se violacao de tokens, design-system-architect bloqueia ate correcao"

  build-prototype:
    agents: [jessica-ux-ui, ux-design-expert]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "construir prototipo interativo" }
      2: { agent: ux-design-expert, role: reviewer, action: "validar cenarios e interacoes" }
    frameworks:
      mandatory: [frameworks/prototyping-layer]
      optional: [frameworks/hypothesis-driven-design]
    checklists: [checklists/prototyping-quality, checklists/prototyping/proto-interaction-fidelity]
    templates: [templates/research/usability-test-plan]
    registry: data/registries/design-artifact-registry
    quality_gate: prototyping-quality

  design-motion-specs:
    agents: [jessica-ux-ui, design-system-architect]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "definir motion specs" }
      2: { agent: design-system-architect, role: reviewer, action: "validar integracao com DS" }
    frameworks:
      mandatory: [frameworks/motion-design-system]
    checklists: [checklists/motion-quality]
    templates: [templates/ui/motion-spec-template]
    registry: data/registries/design-artifact-registry
    quality_gate: motion-quality

  content-design-microcopy:
    agents: [ux-design-expert, jessica-ux-ui]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "definir microcopy e UX writing" }
      2: { agent: jessica-ux-ui, role: support, action: "integrar copy na UI" }
    frameworks:
      mandatory: [frameworks/content-design-microcopy]
    checklists: [checklists/content-design-quality]
    templates: [templates/ui/empty-state-library-template]
    registry: data/registries/content-registry
    quality_gate: content-design-quality
    handoff_rule: "Microcopy final deve ser validado pelo copy_squad antes de publish"

  create-visual-explorations:
    agents: [nano-banana-generator, jessica-ux-ui]
    agent_sequence:
      1: { agent: nano-banana-generator, role: executor, action: "gerar variacoes visuais rapidas" }
      2: { agent: jessica-ux-ui, role: curator, action: "selecionar e refinar direcoes" }
    frameworks:
      mandatory: [frameworks/visual-exploration-framework]
      optional: [frameworks/kano-model]
    checklists: [checklists/ui-visual-quality]
    templates: [templates/briefs/visual-exploration-brief]
    registry: data/registries/design-artifact-registry
    quality_gate: ui-visual-quality

  # === DESIGN SYSTEM ===

  design-system-bootstrap:
    agents: [design-system-architect, brad-frost, dan-mall]
    agent_sequence:
      1: { agent: dan-mall, role: strategist, action: "definir modelo de equipe e governanca" }
      2: { agent: brad-frost, role: architect, action: "definir arquitetura atomica e tokens" }
      3: { agent: design-system-architect, role: executor, action: "implementar estrutura base" }
    frameworks:
      mandatory: [frameworks/design-system-layer]
      optional: [frameworks/frost-atomic-design-methodology, frameworks/mall-design-system-strategy]
    checklists: [checklists/design-system-quality, checklists/design-system/ds-token-architecture]
    templates: [templates/design-system/component-rfc-template]
    registry: data/registries/components-registry
    quality_gate: design-system-quality
    rework_loop: "Se arquitetura nao segue atomic design, brad-frost bloqueia e reestrutura"

  create-component-spec:
    agents: [design-system-architect, brad-frost]
    agent_sequence:
      1: { agent: design-system-architect, role: executor, action: "criar spec de componente" }
      2: { agent: brad-frost, role: reviewer, action: "validar atomicidade e reutilizacao" }
    frameworks:
      mandatory: [frameworks/component-spec-framework]
      optional: [frameworks/frost-atomic-design-methodology]
    checklists: [checklists/component-spec-quality, checklists/design-system/ds-component-anatomy]
    templates: [templates/ui/component-spec-template]
    registry: data/registries/components-registry
    quality_gate: component-spec-quality
    rework_loop: "Se componente nao atende a11y ou nao usa tokens, bloqueia publicacao"

  create-or-update-tokens:
    agents: [design-system-architect, brad-frost]
    agent_sequence:
      1: { agent: design-system-architect, role: executor, action: "criar ou atualizar tokens" }
      2: { agent: brad-frost, role: reviewer, action: "validar naming e arquitetura 3-tier" }
    frameworks:
      mandatory: [frameworks/design-token-architecture]
    checklists: [checklists/token-quality, checklists/design-system/ds-token-architecture]
    templates: [templates/design-system/token-spec-template]
    registry: data/registries/tokens-registry
    quality_gate: token-quality

  publish-library:
    agents: [design-system-architect, design-chief]
    agent_sequence:
      1: { agent: design-system-architect, role: executor, action: "preparar release da biblioteca" }
      2: { agent: design-chief, role: approver, action: "aprovar publicacao" }
    frameworks:
      mandatory: [frameworks/library-publish-framework]
      optional: [frameworks/design-system-governance]
    checklists: [checklists/design-system-quality, checklists/design-system/ds-versioning-and-changelog]
    templates: [templates/handoff/release-notes-template, templates/design-system/changelog-template]
    registry: data/registries/components-registry
    quality_gate: design-system-quality
    rework_loop: "Se breaking change nao documentado, bloqueia ate changelog atualizado"

  ds-health-check:
    agents: [design-system-architect, brad-frost, dan-mall]
    agent_sequence:
      1: { agent: design-system-architect, role: executor, action: "executar health check" }
      2: { agent: brad-frost, role: advisor, action: "avaliar cobertura e qualidade tecnica" }
      3: { agent: dan-mall, role: advisor, action: "avaliar adocao e alinhamento estrategico" }
    frameworks:
      mandatory: [frameworks/design-system-governance]
      optional: [frameworks/design-maturity-model]
    checklists: [checklists/design-system-quality, checklists/design-system/ds-audit-and-dedup]
    templates: [templates/design-system/ds-health-report-template]
    registry: data/registries/components-registry
    quality_gate: design-system-quality

  # === ACCESSIBILITY ===

  a11y-audit:
    agents: [ux-design-expert, design-system-architect]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "executar audit WCAG" }
      2: { agent: design-system-architect, role: support, action: "verificar componentes do DS" }
    frameworks:
      mandatory: [frameworks/accessibility-wcag-aa]
      optional: [frameworks/accessibility-by-default]
    checklists: [checklists/accessibility-quality, checklists/accessibility/a11y-wcag-audit]
    templates: [templates/reports/a11y-audit-report-template]
    registry: data/registries/accessibility-issues-registry
    quality_gate: accessibility-quality
    rework_loop: "Violacoes criticas bloqueiam release ate remediacao completa"

  remediate-and-verify:
    agents: [jessica-ux-ui, design-system-architect]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "corrigir violacoes de a11y" }
      2: { agent: design-system-architect, role: verifier, action: "verificar correcoes no DS" }
    frameworks:
      mandatory: [frameworks/accessibility-by-default]
    checklists: [checklists/accessibility-quality, checklists/accessibility/a11y-color-contrast]
    templates: [templates/reports/a11y-audit-report-template]
    registry: data/registries/accessibility-issues-registry
    quality_gate: accessibility-quality

  # === HANDOFF & QA ===

  dev-handoff:
    agents: [jessica-ux-ui, design-system-architect, design-chief]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "preparar pacote de handoff" }
      2: { agent: design-system-architect, role: reviewer, action: "validar tokens e specs" }
      3: { agent: design-chief, role: approver, action: "aprovar handoff final" }
    frameworks:
      mandatory: [frameworks/handoff-layer]
      optional: [frameworks/design-to-code-handoff]
    checklists: [checklists/handoff-quality, checklists/handoff/handoff-specs-and-redlines, checklists/handoff/handoff-token-sync]
    templates: [templates/handoff/dev-handoff-checklist-template, templates/handoff/edge-cases-documentation-template]
    registry: data/registries/handoff-registry
    quality_gate: handoff-quality
    rework_loop: "Se specs incompletas ou assets faltando, bloqueia handoff e retorna a jessica-ux-ui"

  qa-with-engineering:
    agents: [design-chief, jessica-ux-ui]
    agent_sequence:
      1: { agent: jessica-ux-ui, role: executor, action: "comparar implementacao com specs" }
      2: { agent: design-chief, role: approver, action: "decisao final de aprovacao" }
    frameworks:
      mandatory: [frameworks/qa-review-framework]
    checklists: [checklists/handoff/handoff-qa-with-dev]
    templates: [templates/handoff/qa-bug-template]
    registry: data/registries/qa-registry
    quality_gate: handoff-quality
    rework_loop: "Se bugs visuais criticos, bloqueia merge e reporta via qa-bug-template"

  # === GOVERNANCE ===

  post-release-review:
    agents: [design-chief, ux-design-expert, dan-mall]
    agent_sequence:
      1: { agent: ux-design-expert, role: executor, action: "coletar metricas pos-release" }
      2: { agent: dan-mall, role: advisor, action: "avaliar impacto estrategico" }
      3: { agent: design-chief, role: approver, action: "consolidar learnings" }
    frameworks:
      mandatory: [frameworks/governance-layer]
      optional: [frameworks/heart-metrics-framework, frameworks/north-star-and-success-metrics]
    checklists: [checklists/design-system/ds-design-code-sync-audit]
    templates: [templates/reports/design-review-report-template]
    registry: data/registries/governance-registry
    quality_gate: metrics-review-quality

  design-critique-session:
    agents: [design-chief, dan-mall, dave-malouf]
    agent_sequence:
      1: { agent: dan-mall, role: facilitator, action: "facilitar sessao de critica" }
      2: { agent: dave-malouf, role: advisor, action: "avaliar qualidade e maturidade" }
      3: { agent: design-chief, role: recorder, action: "registrar decisoes e acoes" }
    frameworks:
      mandatory: [frameworks/design-review-and-critique]
      optional: [frameworks/malouf-design-quality-model]
    checklists: [checklists/design-critique-quality]
    templates: [templates/reports/design-review-report-template]
    registry: data/registries/governance-registry
    quality_gate: design-critique-quality

  quarterly-design-review:
    agents: [design-chief, dan-mall, dave-malouf, brad-frost]
    agent_sequence:
      1: { agent: design-chief, role: executor, action: "preparar relatorio trimestral" }
      2: { agent: dan-mall, role: advisor, action: "avaliar eficiencia operacional" }
      3: { agent: dave-malouf, role: advisor, action: "avaliar maturidade do squad" }
      4: { agent: brad-frost, role: advisor, action: "avaliar saude do design system" }
    frameworks:
      mandatory: [frameworks/governance-layer]
      optional: [frameworks/design-maturity-model, frameworks/malouf-designops-framework]
    checklists: [checklists/design-documentation-quality]
    templates: [templates/reports/quarterly-design-report]
    registry: data/registries/governance-registry
    quality_gate: metrics-review-quality

  design-debt-prioritization:
    agents: [design-chief, design-system-architect, dan-mall]
    agent_sequence:
      1: { agent: design-system-architect, role: executor, action: "inventariar debt e classificar" }
      2: { agent: dan-mall, role: advisor, action: "priorizar por impacto vs esforco" }
      3: { agent: design-chief, role: approver, action: "aprovar backlog de debt" }
    frameworks:
      mandatory: [frameworks/design-debt-management]
      optional: [frameworks/mall-1000-dollar-exercise]
    checklists: [checklists/design-debt-quality]
    templates: [templates/reports/design-debt-report-template]
    registry: data/registries/design-debt-registry
    quality_gate: design-debt-quality

# ------------------------------------------------------------
# Cross-Squad Integration
# ------------------------------------------------------------
cross_squad:

  copy_squad:
    handoff_to_design:
      - tom-de-voz-guidelines
      - glossario-de-produto
      - microcopy-aprovado
    handoff_from_design:
      - contexto-de-tela
      - fluxo-do-usuario
      - wireframe-com-placeholder
    shared_assets:
